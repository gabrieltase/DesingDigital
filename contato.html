<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.CSS" />
  </head>
  <body>
    <header>
      <img src="logo 2.png" alt="logotipo do site" class="logo img-fluid" />
      <header class="topo">
        <div class="top">
          <nav class="menu nav justify-content-center gap-2">
            <a href="index.html" class="nav-link btn btn-rosa">Home</a>
            <a href="sobre.html" class="nav-link btn btn-rosa">Sobre</a>
            <a href="contato.html" class="nav-link btn btn-rosa">Contato</a>
          </nav>
        </div>
      </header>
    </header>
    <!-- SEÇAO DE CONTATO -->
    <section class="contato" id="contato">
      <h1 class="display-4 fw-bold text-center">Entre em Contato</h1>
      <p class="lead text-center text-muted">
        Gostou de Alguma Peça Entre em Contado Comigo
      </p>
      <form>
        <div class="card shadow p-4 mx-auto" style="max-width: 600px">
          <h2 class="text-center mb-4">Entre em Contato</h2>

          <p class="text-center text-muted mb-4">
            Gostou de alguma peça? Entre em contato conosco!
          </p>

          <form>
            <div class="mb-3">
              <label for="nome" class="form-label">Nome:</label>
              <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Digite seu nome"
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail:</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Digite seu e-mail"
              />
            </div>

            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem:</label>
              <textarea
                id="mensagem"
                class="form-control"
                rows="5"
                placeholder="Digite sua mensagem"
              ></textarea>
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-rosa btn-lg px-4">
                Enviar Mensagem
              </button>
            </div>
          </form>
        </div>
      </form>
    </section>
  </body>
</html>
